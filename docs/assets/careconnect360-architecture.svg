<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">CareConnect 360 target architecture</title>
  <desc id="description">A planned React client connects to a protected Express API, which coordinates service modules, MongoDB, optional AI, and optional notifications.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fc" />
      <stop offset="1" stop-color="#e8f3f3" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#14213d" flood-opacity="0.10" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#0f766e" />
    </marker>
    <style>
      .title { font: 700 25px 'DM Sans', 'Segoe UI', sans-serif; fill: #14213d; }
      .subtitle { font: 400 13px 'DM Sans', 'Segoe UI', sans-serif; fill: #64748b; }
      .label { font: 700 15px 'DM Sans', 'Segoe UI', sans-serif; fill: #14213d; }
      .detail { font: 400 12px 'DM Sans', 'Segoe UI', sans-serif; fill: #526176; }
      .small { font: 600 11px 'DM Sans', 'Segoe UI', sans-serif; fill: #0f766e; }
    </style>
  </defs>

  <rect width="1200" height="520" rx="22" fill="url(#canvas)" />
  <text x="44" y="52" class="title">CareConnect 360</text>
  <text x="44" y="76" class="subtitle">Target platform architecture · integrations remain optional</text>
  <rect x="895" y="34" width="260" height="34" rx="17" fill="#fff" stroke="#c8d8e5" />
  <circle cx="915" cy="51" r="5" fill="#f59e0b" />
  <text x="929" y="55" class="small">PLANNED, NOT YET RUNNING</text>

  <g fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M255 250H320" />
    <path d="M535 250H600" />
    <path d="M815 220H875V160H925" />
    <path d="M815 280H875V360H925" />
    <path d="M705 335V405" />
  </g>
  <g fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6">
    <path d="M925 181H875V237H815" />
    <path d="M925 381H875V263H815" />
  </g>

  <g filter="url(#shadow)">
    <rect x="45" y="174" width="210" height="152" rx="14" fill="#fff" stroke="#cbd8e6" />
    <rect x="45" y="174" width="210" height="8" rx="4" fill="#38bdf8" />
    <text x="68" y="214" class="label">Role-based client</text>
    <text x="68" y="240" class="detail">Customer · Agent · Admin</text>
    <text x="68" y="262" class="detail">React · TypeScript · Router</text>
    <text x="68" y="292" class="small">Responsive web application</text>

    <rect x="320" y="174" width="215" height="152" rx="14" fill="#fff" stroke="#b6d8d2" />
    <rect x="320" y="174" width="215" height="8" rx="4" fill="#0f766e" />
    <text x="343" y="214" class="label">Protected API</text>
    <text x="343" y="240" class="detail">Express · /api/v1</text>
    <text x="343" y="262" class="detail">Auth · validation · RBAC</text>
    <text x="343" y="292" class="small">Business rules and access checks</text>

    <rect x="600" y="150" width="215" height="200" rx="14" fill="#fff" stroke="#b6d8d2" />
    <rect x="600" y="150" width="215" height="8" rx="4" fill="#14213d" />
    <text x="623" y="190" class="label">Service layer</text>
    <text x="623" y="218" class="detail">Tickets · Feedback</text>
    <text x="623" y="240" class="detail">Knowledge · Services</text>
    <text x="623" y="262" class="detail">Analytics · CSR · Audit</text>
    <text x="623" y="310" class="small">Validated, authorized workflows</text>

    <rect x="925" y="105" width="230" height="110" rx="14" fill="#fff" stroke="#b6d8d2" />
    <rect x="925" y="105" width="7" height="110" rx="3" fill="#38bdf8" />
    <text x="949" y="145" class="label">Optional AI</text>
    <text x="949" y="170" class="detail">Approved article grounding</text>
    <text x="949" y="192" class="small">Provider or labeled demo mode</text>

    <rect x="925" y="305" width="230" height="110" rx="14" fill="#fff" stroke="#cbd8e6" />
    <rect x="925" y="305" width="7" height="110" rx="3" fill="#f59e0b" />
    <text x="949" y="345" class="label">Optional messaging</text>
    <text x="949" y="370" class="detail">Email / SMS provider</text>
    <text x="949" y="392" class="small">In-app fallback notifications</text>

    <rect x="600" y="405" width="215" height="82" rx="14" fill="#14213d" />
    <text x="623" y="440" style="font:700 15px 'DM Sans','Segoe UI',sans-serif;fill:#fff">MongoDB</text>
    <text x="623" y="464" style="font:400 12px 'DM Sans','Segoe UI',sans-serif;fill:#d5e0ed">Mongoose models · indexes</text>
  </g>

  <text x="320" y="371" class="subtitle">Secure HTTP-only session cookie</text>
  <text x="859" y="248" class="subtitle">server-side calls</text>
  <text x="844" y="464" class="subtitle">persisted records</text>
</svg>